# NOTE: GitHub only runs `schedule:` triggers for workflows that exist on the
# repository's DEFAULT branch. A copy of this file living on a feature branch
# will never fire on a cron, however correct it is. Merge to main to arm it.
# Scheduled workflows are also auto-disabled after 60 days without repository
# activity; GitHub emails first, and `workflow_dispatch` re-enables them.
name: weekly update

on:
  schedule:
    # 06:17 UTC every Monday. Avoid :00 — scheduled runs cluster there and get queued.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: "Ignore the incremental cutoff and re-harvest everything"
        type: boolean
        default: false

permissions:
  contents: write   # commit the updated corpus
  pages: write      # publish the rebuilt site
  id-token: write   # required by actions/deploy-pages

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # actions/deploy-pages requires the job to declare this environment; without
    # it the deployment step fails even though the artifact uploaded fine.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"       # tomllib needs >= 3.11
          cache: pip

      # Install the package rather than just its dependency: `python -m qpdewatch`
      # otherwise relies on the current directory being importable, which is true
      # on these runners but is not something to depend on.
      - run: pip install -e ".[figures]"

      - name: Harvest, enrich and rebuild
        env:
          # Optional: set this repository variable to join Crossref's polite pool.
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
        # --max-lookups is deliberately small. The harvest already spends ~31
        # arXiv requests; the abstract backfill can spend one per queued record
        # and is what tips the run over arXiv's quota. 40 a week drains the
        # queue steadily without getting the runner blocked.
        run: |
          python -m qpdewatch update --max-lookups 40 ${{ inputs.full && '--full' || '' }}

      - name: Corpus integrity
        run: python -m qpdewatch check

      - name: Summarise
        run: python -m qpdewatch stats >> "$GITHUB_STEP_SUMMARY"

      - name: Commit if the corpus changed
        run: |
          git config user.name  "quantum-pde-watch bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          # Only data/corpus.jsonl and data/state.json are tracked; the CSVs,
          # figures and the site are gitignored derived outputs, rebuilt here and
          # published below rather than committed. Committing them would add
          # megabytes to history every week for no recoverable information.
          if git diff --cached --quiet -- data/corpus.jsonl; then
            echo "no new papers and no citation changes"
            git reset -q
          else
            NEW=$(git diff --cached --numstat -- data/corpus.jsonl | awk '{print $1}')
            git commit -m "weekly update $(date -u +%Y-%m-%d): ${NEW:-0} corpus line(s) added"
            git push
          fi

      # Publish the freshly built site. Settings -> Pages -> Source must be set
      # to "GitHub Actions" for this to take effect.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

      # Last, deliberately. An arXiv rate-limit must not cost you the Crossref
      # papers already gathered or leave the site un-republished — but the run
      # still has to go red, because a weekly job that stays green while
      # collecting nothing is how a corpus quietly acquires a hole. state.json
      # does not advance on a failed harvest, so the window is retried in full.
      - name: Fail if the harvest was incomplete
        run: |
          FAILED=$(python -c "import json;print(len(json.load(open('data/state.json')).get('last_failed_queries',[])))")
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED arXiv queries failed — arXiv contributed nothing this run. Crossref results and the site were still published."
            exit 1
          fi
