# NOTE: GitHub only runs `schedule:` triggers for workflows that exist on the
# repository's DEFAULT branch. A copy of this file living on a feature branch
# will never fire on a cron, however correct it is. Merge to main to arm it.
# Scheduled workflows are also auto-disabled after 60 days without repository
# activity; GitHub emails first, and `workflow_dispatch` re-enables them.
name: weekly update

on:
  schedule:
    # 06:17 UTC every Monday. Avoid :00 — scheduled runs cluster there and get queued.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: "Ignore the incremental cutoff and re-harvest everything"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"       # tomllib needs >= 3.11
          cache: pip

      - run: pip install -r requirements.txt

      - name: Harvest, enrich and rebuild
        env:
          # Optional: set this repository variable to join Crossref's polite pool.
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
        run: |
          python -m qpdewatch update ${{ inputs.full && '--full' || '' }}

      - name: Summarise
        run: python -m qpdewatch stats >> "$GITHUB_STEP_SUMMARY"

      - name: Commit if the corpus changed
        run: |
          git config user.name  "quantum-pde-watch bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          # Every build rewrites docs/index.html (it stamps today's date) and the
          # CSVs, so "anything changed" is always true and would add ~2.4 MB to
          # history every week forever. The corpus itself is the real signal:
          # if no paper arrived and no citation count moved, throw the rebuild away.
          if git diff --cached --quiet -- data/corpus.jsonl; then
            echo "no new papers and no citation changes; discarding regenerated outputs"
            git reset -q
            git checkout -- data docs
          else
            NEW=$(git diff --cached --numstat -- data/corpus.jsonl | awk '{print $1}')
            git commit -m "weekly update $(date -u +%Y-%m-%d): ${NEW:-0} corpus line(s) added"
            git push
          fi
