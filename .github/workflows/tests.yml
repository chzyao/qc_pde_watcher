# Runs on every push and pull request. Entirely offline: no arXiv or Crossref
# call, so it cannot fail because an upstream service is rate-limiting you, and
# it stays fast enough to be worth waiting for.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (tomllib landed in 3.11) and current. Over a multi-year
        # project this pair is what warns you that a runtime has moved on.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Corpus integrity
        run: python -m qpdewatch check
      - name: Build reproduces cleanly from the committed corpus
        run: python -m qpdewatch build --no-figures
