[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qpdewatch"
version = "0.1.0"
description = "Tracked corpus of quantum algorithms for classical PDEs, with a CFD gap map"
readme = "README.md"
requires-python = ">=3.11"          # tomllib
dependencies = []                    # stdlib only; matplotlib is optional

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]

[project.scripts]
qpdewatch = "qpdewatch.cli:main"

[tool.setuptools]
packages = ["qpdewatch"]
