[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qpdewatch"
version = "0.1.0"
description = "Tracked corpus of quantum algorithms for classical PDEs, with a CFD gap map"
readme = "README.md"
requires-python = ">=3.11"          # tomllib
dependencies = []                    # stdlib only; matplotlib is optional

[project.optional-dependencies]
# Upper bounds are deliberate. This repo is meant to still build in 2030, and
# an unpinned major version is the usual way a dormant project stops working.
# Raise them on purpose when you next touch it, not by accident on a fresh clone.
figures = ["matplotlib>=3.7,<4"]
dev = ["matplotlib>=3.7,<4", "pytest>=7,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
qpdewatch = "qpdewatch.cli:main"

[tool.setuptools]
packages = ["qpdewatch"]
