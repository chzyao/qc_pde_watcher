"LCU / LCHS" = '(linear combination of unitaries|\bLCU\b|\bLCHS\b|linear combination of Hamiltonian simulation)'
"Schrodingerisation / unitary dilation" = '(Schr(o|\u00f6)dinger(isation|ization)|warped phase transform|unitary dilation|dilation (method|technique)|Schr(o|\u00f6)dingeris)'
"Lindbladian / open-system embedding" = '(Lindblad|\bGKSL\b|Gorini.?Kossakowski|open quantum system|dissipative (engineering|map|channel|process)|Kraus (operator|map|representation)|Stinespring|density matrix encoding|completely positive trace)'
