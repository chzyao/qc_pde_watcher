# Controlled vocabularies for tagging the corpus.
#
# Every value is a case-insensitive Python regex matched against "title + abstract".
# TOML literal strings (single quotes) are used so backslashes need no escaping.
# Edit freely: tags are recomputed from scratch on every run, so a vocabulary change
# propagates to the whole corpus, not just to new papers.
#
# schema_version 1 = the vocabulary used for the original 700-paper corpus.
# schema_version 2 = adds the Lindbladian/open-system family and fixes the
#                    lattice-Boltzmann miss in the Boltzmann PDE target.
schema_version = 2

# ---------------------------------------------------------------------------
# Relevance screen. A record is kept if it matches quantum_terms AND pde_terms
# and its TITLE does not match hard_exclude. This is deterministic and is the
# screen that produced the published 700-paper corpus.
# ---------------------------------------------------------------------------
[screen]
quantum_terms = '(quantum (algorithm|comput|circuit|register|processor|hardware|subroutine|solver|advantage|speedup|simulat|annea|linear|state prep|amplitude)|qubit|HHL|QLSA|QSVT|quantum signal processing|block[- ]encod|variational quantum|VQE|VQA|QAOA|NISQ|fault[- ]tolerant|Carleman|Schr(o|\u00f6)dinger(isation|ization)|LCHS|linear combination of (unitaries|Hamiltonian)|tensor network|matrix product state|quantum[- ]inspired|annealer|amplitude (estimation|amplification)|Grover|phase estimation)'
pde_terms = '(partial differential|differential equation|\bPDE\b|\bODE\b|Navier.?Stokes|Euler equation|Burgers|advection|diffusion equation|convection|Poisson equation|Laplace equation|heat equation|wave equation|Boltzmann|fluid|flow field|turbulen|\bCFD\b|linear system|finite (difference|element|volume)|Maxwell|magnetohydrodynam|hydrodynam|reaction.?diffusion|Fokker.?Planck|Black.?Scholes|elasticity|aerodynam|porous media|shallow water|Vlasov|kinetic equation|transport equation|numerical (solver|simulation|scheme)|discretis|discretiz)'
hard_exclude = '(No Drama|AInsteinBench|Gate Architecture via Teleportation|full adder in Ising|molecular response properties|eigensolver using variational adiabatic|chemistry in Hamiltonian-wavefunction|Multiscale Modeling: A Hierarchy|Highly Excited Eigenstates|Corrosion Modeling)'

# PDE targets that make a paper "CFD-facing".
cfd_pde_targets = [
  "Navier-Stokes (incompressible)",
  "Euler / compressible / shocks",
  "Turbulence / high Reynolds",
  "Boltzmann / kinetic / Vlasov",
  "Burgers / model nonlinear",
  "Advection-diffusion / transport",
]

# ---------------------------------------------------------------------------
