"Variational / VQA / quantum ML" = '(variational quantum|\bVQA\b|\bVQE\b|\bQAOA\b|ansatz|parameteri[sz]ed quantum circuit|parametri[sz]ed quantum circuit|quantum neural|physics.?informed quantum|differentiable quantum|quantum machine learning|quantum kernel)'
"Quantum lattice Boltzmann / lattice gas" = '(lattice Boltzmann|lattice gas|\bQLBM\b|Carleman.?lattice|collision.{0,25}streaming|streaming.{0,25}collision)'
